<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="76" viewBox="0 0 1200 76" role="img" aria-label="About me">
<title>About me</title>
<defs>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
<linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>.in{opacity:0;animation:in .8s cubic-bezier(.2,.8,.2,1) forwards}@keyframes in{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}</style>

<rect width="1200" height="76" rx="18" fill="#071525"/>
<rect x="1" y="1" width="1198" height="74" rx="17" fill="none" stroke="#16324d" stroke-width="2"/>
<g class="in"><rect x="20" y="14" width="64" height="40" rx="12" fill="#0b1c33" stroke="url(#acc)" stroke-width="2"/>
<text x="52" y="42" text-anchor="middle" fill="#22d3ee" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="22" font-weight="800">01</text></g>
<g class="in" style="animation-delay:.15s"><text x="104" y="44" fill="#eef4ff" font-family="Inter,'Segoe UI',Roboto,Arial,sans-serif" font-size="30" font-weight="800">About me</text></g>
<text x="1172" y="41" text-anchor="end" fill="#4b6a8f" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="18">about_me</text>
<rect x="24" y="62" width="1152" height="2" rx="1" fill="#16324d"/>
<rect x="24" y="61.5" width="240" height="3" rx="1.5" fill="url(#beam)" filter="url(#glow)"><animate attributeName="x" values="24;936;24" dur="5s" repeatCount="indefinite"/></rect>

</svg>
